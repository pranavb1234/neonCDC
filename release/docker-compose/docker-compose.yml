services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  walflow-server:
    image: ${WALFLOW_IMAGE:?Set WALFLOW_IMAGE in .env to a published Walflow image}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      METADATA_DB_PATH: /data/walflow.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${WALFLOW_PORT:-3000}:3000"
    volumes:
      - walflow-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

volumes:
  redis-data:
    name: walflow-redis-data
  walflow-data:
    name: walflow-data
