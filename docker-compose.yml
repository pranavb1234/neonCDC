services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  metadata:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: worker/Dockerfile.metadata
    environment:
      METADATA_DB_PATH: /data/cdc-lite.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    volumes:
      - cdc-lite-data:/data

volumes:
  redis-data:
  cdc-lite-data:
