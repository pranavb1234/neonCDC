services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  metadata:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: worker/Dockerfile.metadata
    environment:
      METADATA_DB_PATH: /data/walflow.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    volumes:
      - walflow-data:/data

volumes:
  redis-data:
  walflow-data:
